authors        = ["Osman Mesut Ozcan <panikka.studio>", "ask4fusora <ask4fusora@gmail.com>"]
description    = "Dprint support for Zed"
id             = "dprint"
name           = "Dprint"
repository     = "https://github.com/panikkastudio/dprint-zed"
